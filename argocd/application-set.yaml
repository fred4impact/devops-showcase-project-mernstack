apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ticketnow-applications
  namespace: argocd
  labels:
    app.kubernetes.io/name: ticketnow
    app.kubernetes.io/part-of: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/your-username/mernstack-devops-showcase-project
      revision: HEAD
      files:
      - path: "argocd/environments/*/values.yaml"
  
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/name: ticketnow
        app.kubernetes.io/part-of: argocd
        environment: '{{path.basename}}'
    
    spec:
      project: ticketnow-project
      
      source:
        repoURL: https://github.com/your-username/mernstack-devops-showcase-project
        targetRevision: HEAD
        path: kubernetes
        helm:
          valueFiles:
          - 'argocd/environments/{{path.basename}}/values.yaml'
      
      destination:
        server: https://kubernetes.default.svc
        namespace: ticketnow-{{path.basename}}
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      revisionHistoryLimit: 10
