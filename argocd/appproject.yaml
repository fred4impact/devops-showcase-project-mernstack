apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ticketnow-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: TicketNow MERN Stack Application Project
  
  sourceRepos:
  - 'https://github.com/your-username/mernstack-devops-showcase-project'
  - 'https://github.com/argoproj/argocd-example-apps'
  
  destinations:
  - namespace: ticketnow
    server: https://kubernetes.default.svc
  - namespace: argocd
    server: https://kubernetes.default.svc
  
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: PersistentVolumeClaim
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolume
  - group: apps
    kind: Deployment
  - group: apps
    kind: ReplicaSet
  - group: apps
    kind: StatefulSet
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: policy
    kind: PodDisruptionBudget
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: batch
    kind: Job
  - group: batch
    kind: CronJob
  - group: argoproj.io
    kind: Application
  - group: argoproj.io
    kind: AppProject
  
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: PersistentVolumeClaim
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  - group: apps
    kind: ReplicaSet
  - group: apps
    kind: StatefulSet
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: policy
    kind: PodDisruptionBudget
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: batch
    kind: Job
  - group: batch
    kind: CronJob
  
  roles:
  - name: ticketnow-admin
    description: TicketNow Application Administrator
    policies:
    - p, proj:ticketnow-project:ticketnow-admin, applications, *, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-admin, repositories, *, *, allow
    - p, proj:ticketnow-project:ticketnow-admin, certificates, *, *, allow
    - p, proj:ticketnow-project:ticketnow-admin, clusters, *, *, allow
    - p, proj:ticketnow-project:ticketnow-admin, projects, *, ticketnow-project, allow
    - p, proj:ticketnow-project:ticketnow-admin, logs, get, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-admin, exec, create, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-admin, metrics, get, ticketnow-project/*, allow
    groups:
    - ticketnow-admins
  
  - name: ticketnow-developer
    description: TicketNow Application Developer
    policies:
    - p, proj:ticketnow-project:ticketnow-developer, applications, get, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-developer, applications, sync, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-developer, applications, action/*, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-developer, logs, get, ticketnow-project/*, allow
    - p, proj:ticketnow-project:ticketnow-developer, metrics, get, ticketnow-project/*, allow
    groups:
    - ticketnow-developers
  
  syncWindows:
  - kind: allow
    schedule: '0 0 * * *'
    duration: 1h
    applications:
    - ticketnow-*
    namespaces:
    - ticketnow
    manualSync: true
