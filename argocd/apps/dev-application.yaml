apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketnow-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ticketnow-project
  source:
    repoURL: https://github.com/fred4impact/devops-showcase-project-mernstack
    targetRevision: develop
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketnow-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
