# Production Environment Values
# This file contains environment-specific configurations for the TicketNow application

# Application Configuration
app:
  name: ticketnow
  environment: production
  version: "1.0.0"

# Replica Configuration
replicas:
  backend: 3
  frontend: 3
  mongodb: 1
  redis: 1

# Resource Configuration
resources:
  backend:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  frontend:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  mongodb:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  redis:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Storage Configuration
storage:
  mongodb:
    size: "50Gi"
    storageClass: "fast-ssd"
  redis:
    size: "10Gi"
    storageClass: "fast-ssd"

# Environment Variables
env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DEBUG: "false"

# Ingress Configuration
ingress:
  enabled: true
  host: "ticketnow.yourdomain.com"
  tls:
    enabled: true
    secretName: "ticketnow-tls"

# Monitoring Configuration
monitoring:
  enabled: true
  metrics:
    enabled: true
  logging:
    level: "info"

# Security Configuration
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

# Auto-scaling Configuration
autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Health Checks
healthChecks:
  backend:
    livenessProbe:
      httpGet:
        path: /health
        port: 3001
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 3001
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  frontend:
    livenessProbe:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
