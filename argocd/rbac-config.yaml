apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    # TicketNow Project Administrators
    p, role:ticketnow-admin, applications, *, ticketnow-project/*, allow
    p, role:ticketnow-admin, repositories, *, *, allow
    p, role:ticketnow-admin, certificates, *, *, allow
    p, role:ticketnow-admin, clusters, *, *, allow
    p, role:ticketnow-admin, projects, *, ticketnow-project, allow
    p, role:ticketnow-admin, logs, get, ticketnow-project/*, allow
    p, role:ticketnow-admin, exec, create, ticketnow-project/*, allow
    p, role:ticketnow-admin, metrics, get, ticketnow-project/*, allow
    
    # TicketNow Project Developers
    p, role:ticketnow-developer, applications, get, ticketnow-project/*, allow
    p, role:ticketnow-developer, applications, sync, ticketnow-project/*, allow
    p, role:ticketnow-developer, applications, action/*, ticketnow-project/*, allow
    p, role:ticketnow-developer, logs, get, ticketnow-project/*, allow
    p, role:ticketnow-developer, metrics, get, ticketnow-project/*, allow
    
    # Read-only access for monitoring
    p, role:ticketnow-readonly, applications, get, ticketnow-project/*, allow
    p, role:ticketnow-readonly, logs, get, ticketnow-project/*, allow
    p, role:ticketnow-readonly, metrics, get, ticketnow-project/*, allow
    
    # Group assignments
    g, ticketnow-admins, role:ticketnow-admin
    g, ticketnow-developers, role:ticketnow-developer
    g, ticketnow-monitors, role:ticketnow-readonly
    
    # Default policy for unauthenticated users
    p, role:readonly, applications, get, *, allow
    p, role:readonly, logs, get, *, allow
    p, role:readonly, metrics, get, *, allow
