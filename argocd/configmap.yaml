apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # ArgoCD Configuration
  application.instanceLabelKey: argocd.argoproj.io/instance
  server.rbac.log.enforce.enable: "true"
  server.rbac.log.enforce.enable: "true"
  server.rbac.log.enforce.enable: "true"
  
  # Repository Configuration
  repositories: |
    - type: git
      url: https://github.com/your-username/mernstack-devops-showcase-project
      name: ticketnow-repo
  
  # Resource Tracking
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
  
  # Sync Policy
  application.instanceLabelKey: argocd.argoproj.io/instance
  
  # UI Configuration
  ui.default.destinations: |
    - server: https://kubernetes.default.svc
      namespace: ticketnow
    - server: https://kubernetes.default.svc
      namespace: argocd
  
  # Resource Exclusions
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      clusters:
      - "*"
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumEndpoint
      clusters:
      - "*"
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumNode
      clusters:
      - "*"
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumNetworkPolicy
      clusters:
      - "*"
  
  # Resource Inclusions
  resource.inclusions: |
    - apiGroups:
      - ""
      kinds:
      - ConfigMap
      - Secret
      - Service
      - PersistentVolumeClaim
      - ServiceAccount
    - apiGroups:
      - apps
      kinds:
      - Deployment
      - ReplicaSet
      - StatefulSet
    - apiGroups:
      - networking.k8s.io
      kinds:
      - Ingress
      - NetworkPolicy
    - apiGroups:
      - policy
      kinds:
      - PodDisruptionBudget
    - apiGroups:
      - autoscaling
      kinds:
      - HorizontalPodAutoscaler
    - apiGroups:
      - batch
      kinds:
      - Job
      - CronJob
