apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketnow-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: ticketnow
    app.kubernetes.io/part-of: argocd
spec:
  project: ticketnow-project
  
  source:
    repoURL: https://github.com/your-username/mernstack-devops-showcase-project
    targetRevision: HEAD
    path: kubernetes
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketnow
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - group: ""
    kind: Service
    jsonPointers:
    - /spec/clusterIP
  
  info:
  - name: "Repository"
    value: "https://github.com/your-username/mernstack-devops-showcase-project"
  - name: "Path"
    value: "kubernetes"
  - name: "Environment"
    value: "production"
  - name: "Team"
    value: "devops"
