name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: docker.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Stage 1: Checkout
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for better analysis

      - name: Generate version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "version=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Display version
        run: 'echo "Building version: ${{ steps.version.outputs.version }}"'

  # Stage 2: SAST Scan (CodeQL)
  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: checkout
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Stage 3: Build Applications
  build-apps:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: checkout
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: application/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: application/${{ matrix.service }}
        run: npm ci

      - name: Run linting
        working-directory: application/${{ matrix.service }}
        run: npm run lint

      - name: Run type checking
        working-directory: application/${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            npm run type-check
          else
            npx tsc --noEmit
          fi

      - name: Build application
        working-directory: application/${{ matrix.service }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: application/${{ matrix.service }}/dist
          retention-days: 1

  # Stage 4: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [checkout, build-apps]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install backend dependencies
        working-directory: application/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: application/frontend
        run: npm ci

      - name: Build backend
        working-directory: application/backend
        run: npm run build

      - name: Build frontend
        working-directory: application/frontend
        run: npm run build

      - name: Start backend service
        working-directory: application/backend
        run: |
          npm run start:prod &
          echo $! > backend.pid
        env:
          MONGO_URI: mongodb://localhost:27017/ticketnow-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
          PORT: 3001

      - name: Start frontend service
        working-directory: application/frontend
        run: |
          npm run start &
          echo $! > frontend.pid
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'
          echo "Waiting for frontend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
          echo "All services are ready!"

      - name: Run API integration tests
        working-directory: tests
        run: npm test
        env:
          BACKEND_URL: http://localhost:3001
          FRONTEND_URL: http://localhost:3000
          MONGO_URI: mongodb://localhost:27017/ticketnow-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/coverage/
          retention-days: 7

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: tests/coverage/lcov.info
          flags: integration-tests
          name: integration-coverage

      - name: Cleanup services
        if: always()
        run: |
          if [ -f application/backend/backend.pid ]; then
            kill $(cat application/backend/backend.pid) || true
          fi
          if [ -f application/frontend/frontend.pid ]; then
            kill $(cat application/frontend/frontend.pid) || true
          fi

  # Stage 5: Build Docker Images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [checkout, build-apps, integration-tests]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: application/${{ matrix.service }}
          file: application/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Stage 6: Security Scan of Images
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-docker]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      - name: Run Trivy for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # Stage 7: Push to DockerHub (already done in build-docker stage)
  # This stage is for documentation and potential additional registry pushes

  # Stage 8: Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: always()
    steps:
      - name: Clean up Docker images
        run: |
          echo "Cleaning up local Docker images and cache"
          docker system prune -f

      - name: Clean up build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            backend-build
            frontend-build

      - name: Clean up old DockerHub images
        if: github.ref == 'refs/heads/main'
        run: |
          echo "In a real scenario, you would clean up old images from DockerHub"
          echo "This could be done using DockerHub API or a cleanup script"

      - name: Notification
        run: |
          echo "Pipeline completed successfully!"
          echo "Images pushed to: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}"
          echo "Backend: ${{ env.IMAGE_NAME_BACKEND }}"
          echo "Frontend: ${{ env.IMAGE_NAME_FRONTEND }}"
