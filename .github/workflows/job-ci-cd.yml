name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: docker.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Stage 1: Checkout
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for better analysis

      - name: Generate version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "version=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Display version
        run: 'echo "Building version: ${{ steps.version.outputs.version }}"'

  # Stage 2: SAST Scan (CodeQL)
  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: checkout
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Stage 3: Build & Test
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: checkout
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: application/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: application/${{ matrix.service }}
        run: npm ci

      - name: Run linting
        working-directory: application/${{ matrix.service }}
        run: npm run lint

      - name: Run type checking
        working-directory: application/${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            npm run type-check
          else
            npx tsc --noEmit
          fi

      - name: Run unit tests
        working-directory: application/${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            npm test -- --coverage --watchAll=false
          else
            echo "Frontend tests would run here (if configured)"
          fi

      - name: Build application
        working-directory: application/${{ matrix.service }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: application/${{ matrix.service }}/dist
          retention-days: 1

  # Stage 4: Build Docker Images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [checkout, build-test]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: application/${{ matrix.service }}
          file: application/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Stage 5: Security Scan of Images
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-docker]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      - name: Run Trivy for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # Stage 6: Push to DockerHub (already done in build-docker stage)
  # This stage is for documentation and potential additional registry pushes

  # Stage 7: Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: always()
    steps:
      - name: Clean up Docker images
        run: |
          echo "Cleaning up local Docker images and cache"
          docker system prune -f

      - name: Clean up build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            backend-build
            frontend-build

      - name: Clean up old DockerHub images
        if: github.ref == 'refs/heads/main'
        run: |
          echo "In a real scenario, you would clean up old images from DockerHub"
          echo "This could be done using DockerHub API or a cleanup script"

      - name: Notification
        run: |
          echo "Pipeline completed successfully!"
          echo "Images pushed to: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}"
          echo "Backend: ${{ env.IMAGE_NAME_BACKEND }}"
          echo "Frontend: ${{ env.IMAGE_NAME_FRONTEND }}"
