name: Security Scan

on:
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday at 2 AM
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Comprehensive Security Scan
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"

      - name: Run Trivy repository scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "repo"
          scan-ref: "."
          format: "sarif"
          output: "trivy-repo-results.sarif"

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"

      - name: Upload Trivy repository scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-repo-results.sarif"

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: javascript, typescript

      - name: Run npm audit for all packages
        run: |
          echo "🔍 Running npm audit for backend..."
          cd application/backend
          npm audit --audit-level=moderate || echo "Backend audit completed with issues"

          echo "🔍 Running npm audit for frontend..."
          cd ../frontend
          npm audit --audit-level=moderate || echo "Frontend audit completed with issues"

          echo "🔍 Running npm audit for tests..."
          cd ../../tests
          npm audit --audit-level=moderate || echo "Tests audit completed with issues"

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
