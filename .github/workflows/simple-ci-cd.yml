name: Simple CI/CD Pipeline

on:
    push:
        branches: [main, develop]
        tags:
            - "v*"
    pull_request:
        branches: [main, develop]
    workflow_dispatch: # Manual trigger

env:
    REGISTRY: ghcr.io
    BACKEND_IMAGE: ${{ github.repository }}/backend
    FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
    # Build and Test Job
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                app: [backend, frontend]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: application/${{ matrix.app }}/package-lock.json

            - name: Install dependencies
              run: |
                  cd application/${{ matrix.app }}
                  npm ci

            - name: Run linting
              run: |
                  cd application/${{ matrix.app }}
                  npm run lint || echo "Linting completed with issues"

            - name: Build application
              run: |
                  cd application/${{ matrix.app }}
                  npm run build

            # Optional: Run tests (can be skipped with [skip tests] in commit message)
            - name: Run tests (optional)
              if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
              run: |
                  cd application/${{ matrix.app }}
                  npm test || echo "Tests completed with issues"
              continue-on-error: true

    # Docker Build and Push Job
    docker-build-push:
        name: Build and Push Docker Images
        runs-on: ubuntu-latest
        needs: build-and-test
        if: github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for backend
              id: meta-backend
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Extract metadata for frontend
              id: meta-frontend
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                  context: ./application/backend
                  file: ./application/backend/Dockerfile
                  push: true
                  tags: ${{ steps.meta-backend.outputs.tags }}
                  labels: ${{ steps.meta-backend.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push frontend image
              uses: docker/build-push-action@v5
              with:
                  context: ./application/frontend
                  file: ./application/frontend/Dockerfile
                  push: true
                  tags: ${{ steps.meta-frontend.outputs.tags }}
                  labels: ${{ steps.meta-frontend.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Output image information
              run: |
                  echo "🐳 Built and pushed images:"
                  echo "Backend: ${{ steps.meta-backend.outputs.tags }}"
                  echo "Frontend: ${{ steps.meta-frontend.outputs.tags }}"
