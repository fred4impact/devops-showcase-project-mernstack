apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticketnow
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-registry/ticketnow-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: ticketnow-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ticketnow-config
              key: PORT
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: ticketnow-config
              key: MONGO_URI
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: ticketnow-config
              key: REDIS_URL
        - name: FRONTEND_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: ticketnow-config
              key: FRONTEND_BASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: JWT_SECRET
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: S3_BUCKET
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: S3_SECRET_KEY
        - name: S3_REGION
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: S3_REGION
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: SENDGRID_API_KEY
        - name: SENDGRID_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: ticketnow-secrets
              key: SENDGRID_FROM_EMAIL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ticketnow
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
  type: ClusterIP
