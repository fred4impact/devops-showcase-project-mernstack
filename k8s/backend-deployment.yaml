apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketnow-backend
  namespace: ticketnow
  labels:
    app: ticketnow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketnow-backend
  template:
    metadata:
      labels:
        app: ticketnow-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-username/your-repo/backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: mongo-uri
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: jwt-secret
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: stripe-webhook-secret
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: s3-bucket
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: s3-secret-key
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: s3-region
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: sendgrid-api-key
        - name: SENDGRID_FROM_EMAIL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: sendgrid-from-email
        - name: FRONTEND_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: frontend-base-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
