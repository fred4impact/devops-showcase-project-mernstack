apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketnow-frontend
  namespace: ticketnow
  labels:
    app: ticketnow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketnow-frontend
  template:
    metadata:
      labels:
        app: ticketnow-frontend
    spec:
      containers:
      - name: frontend
        image: YOUR_DOCKER_USERNAME/ticketnow-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: api-url
        - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: frontend-secrets
              key: stripe-publishable-key
        - name: NEXT_PUBLIC_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: app-name
        - name: NEXT_PUBLIC_APP_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: app-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
