# GitHub Actions CI/CD Pipeline for Smoke Tests
# This file defines the CI pipeline for running smoke tests

name: Smoke Tests CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        test-suite: [backend, frontend, integration]
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd tests
        npm ci

    - name: Setup test environment
      run: |
        cd tests
        cp .env.example .env
        echo "MONGO_URI=mongodb://localhost:27017/ticketnow-test" >> .env
        echo "REDIS_URL=redis://localhost:6379" >> .env
        echo "JWT_SECRET=test-secret-key" >> .env

    - name: Start backend services
      run: |
        cd application/backend
        npm ci
        npm run build
        npm run start:prod &
        sleep 10
      env:
        MONGO_URI: mongodb://localhost:27017/ticketnow-test
        JWT_SECRET: test-secret-key
        NODE_ENV: test

    - name: Start frontend services
      run: |
        cd application/frontend
        npm ci
        npm run build
        npm run start &
        sleep 10
      env:
        NODE_ENV: test

    - name: Wait for services to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'
        timeout 60 bash -c 'until curl -f http://localhost:3001; do sleep 2; done'

    - name: Run ${{ matrix.test-suite }} tests
      run: |
        cd tests
        npm run test:${{ matrix.test-suite }}
      env:
        BACKEND_URL: http://localhost:3000
        FRONTEND_URL: http://localhost:3001
        MONGO_URI: mongodb://localhost:27017/ticketnow-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret-key
        NODE_ENV: test

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.test-suite }}-${{ matrix.node-version }}
        path: tests/coverage/

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.test-suite == 'backend'
      with:
        file: tests/coverage/lcov.info
        flags: backend
        name: backend-coverage

  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security audit
      run: |
        cd tests
        npm audit --audit-level moderate

    - name: Run dependency check
      run: |
        cd tests
        npm outdated

  performance-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd tests
        npm ci

    - name: Run performance tests
      run: |
        cd tests
        npm run test:performance
      env:
        NODE_ENV: test
        PERFORMANCE_THRESHOLD: 1000

  notification:
    runs-on: ubuntu-latest
    needs: [smoke-tests, security-tests, performance-tests]
    if: always()
    
    steps:
    - name: Notify on success
      if: ${{ needs.smoke-tests.result == 'success' && needs.security-tests.result == 'success' && needs.performance-tests.result == 'success' }}
      run: |
        echo "All tests passed successfully! 🎉"
        
    - name: Notify on failure
      if: ${{ needs.smoke-tests.result == 'failure' || needs.security-tests.result == 'failure' || needs.performance-tests.result == 'failure' }}
      run: |
        echo "Some tests failed. Please check the logs. ❌"
