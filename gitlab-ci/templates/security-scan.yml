# Security Scanning Template
# This template provides security scanning capabilities for the MERN Stack project

.security_scan_template:
  stage: security
  image: node:18-alpine
  before_script:
    - apk add --no-cache git curl
    - npm install -g npm-audit-resolver
  script:
    - echo "Running security scans..."
    - echo "Current directory: $(pwd)"
    - echo "Directory contents:"
    - ls -la
    - |
      # Backend security scan
      if [ -d "application/backend" ] && [ -f "application/backend/package.json" ]; then
        echo "Scanning backend dependencies..."
        cd application/backend
        npm ci --cache .npm --prefer-offline || npm install
        npm audit --audit-level=moderate || echo "Backend audit completed with issues"
        npm audit --json > backend-audit.json || true
      else
        echo "Backend directory or package.json not found, skipping backend audit"
      fi
    - |
      # Frontend security scan
      if [ -d "application/frontend" ] && [ -f "application/frontend/package.json" ]; then
        echo "Scanning frontend dependencies..."
        cd application/frontend
        npm ci --cache .npm --prefer-offline || npm install
        npm audit --audit-level=moderate || echo "Frontend audit completed with issues"
        npm audit --json > frontend-audit.json || true
      else
        echo "Frontend directory or package.json not found, skipping frontend audit"
      fi
    - |
      # Test security scan
      if [ -d "tests" ] && [ -f "tests/package.json" ]; then
        echo "Scanning test dependencies..."
        cd tests
        npm ci --cache .npm --prefer-offline || npm install
        npm audit --audit-level=moderate || echo "Tests audit completed with issues"
        npm audit --json > test-audit.json || true
      else
        echo "Tests directory or package.json not found, skipping tests audit"
      fi
  artifacts:
    reports:
      junit:
        - application/backend/backend-audit.json
        - application/frontend/frontend-audit.json
        - tests/test-audit.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# SAST (Static Application Security Testing)
sast_scan:
  extends: .security_scan_template
  stage: security
  script:
    - echo "Running SAST scan..."
    - |
      # Install security scanning tools
      npm install -g @snyk/cli
      npm install -g retire
    - |
      # Backend SAST
      cd application/backend
      echo "Running SAST on backend..."
      snyk test --severity-threshold=high || true
      retire --path . || true
    - |
      # Frontend SAST
      cd application/frontend
      echo "Running SAST on frontend..."
      snyk test --severity-threshold=high || true
      retire --path . || true
  artifacts:
    reports:
      sast: sast-report.json
    expire_in: 1 week
  allow_failure: true

# Dependency scanning
dependency_scan:
  extends: .security_scan_template
  stage: security
  script:
    - echo "Running dependency scan..."
    - |
      # Scan all package.json files
      find . -name "package.json" -not -path "*/node_modules/*" -exec echo "Scanning {}" \;
      find . -name "package.json" -not -path "*/node_modules/*" -exec npm audit --audit-level=high {} \; || true
  artifacts:
    reports:
      dependency_scanning: dependency-scan-report.json
    expire_in: 1 week
  allow_failure: true
