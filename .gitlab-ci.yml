# MERN Stack DevOps Showcase - CI/CD Pipeline
# Automated build, test, and deployment pipeline for MERN stack application

stages:
  - security
  - build
  - test
  - docker-build
  - image-scan
  - docker-push

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: .npm
  NODE_OPTIONS: "--max-old-space-size=4096"
  DOCKER_TAG: latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/
  policy: pull-push

# 1. Security Scan
security_scan:
  stage: security
  image: node:20-alpine
  script:
    - echo "🔍 Running security audits..."
    - echo "🧹 Clearing npm cache..."
    - npm cache clean --force
    - cd application/backend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit)
    - npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
    - cd ../frontend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit)
    - npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
  tags:
    - shared
  allow_failure: false
  only:
    - develop
    - main



# 2. Build Applications
build:
  stage: build
  image: node:18-alpine
  script:
    - echo "🏗️ Building applications..."
    - cd application/backend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm run build
    - cd ../frontend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm run build
    - echo "✅ All applications built successfully"
  tags:
    - shared
  only:
    - develop
    - main


# 3. Run Tests
tests:
  stage: test
  image: node:18-alpine
  script:
    - echo "🧪 Running all tests..."
    - cd tests/backend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm test || echo "⚠️ Backend tests failed (non-blocking)"
    - cd ../frontend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm test || echo "⚠️ Frontend tests failed (non-blocking)"
    - cd .. && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm test || echo "⚠️ Integration tests failed (non-blocking)"
    - echo "✅ All tests completed"
  allow_failure: true
  tags:
    - shared
  only:
    - develop
    - main


# 4. Docker Build using Kaniko (more reliable for shared runners)
docker_build:
  stage: docker-build
  image: gcr.io/kaniko-project/executor:latest
  variables:
    DOCKER_CONFIG: /kaniko/.docker
  script:
    - echo "🏗️ Building backend image with Kaniko..."
    - /kaniko/executor
        --context application/backend
        --dockerfile application/backend/Dockerfile
        --destination backend:${CI_COMMIT_REF_SLUG}
        --destination backend:${CI_COMMIT_SHA}
        --destination backend:latest
        --cache=true
        --cache-ttl=24h
    - echo "🏗️ Building frontend image with Kaniko..."
    - /kaniko/executor
        --context application/frontend
        --dockerfile application/frontend/Dockerfile
        --destination frontend:${CI_COMMIT_REF_SLUG}
        --destination frontend:${CI_COMMIT_SHA}
        --destination frontend:latest
        --cache=true
        --cache-ttl=24h
    - echo "✅ Build completed"
  tags:
    - shared
  only:
    - develop
    - main


image_scan:
  stage: image-scan
  image: aquasec/trivy:latest
  script:
    - echo "🔍 Scanning backend image..."
    - trivy image backend:latest
    - echo "🔍 Scanning frontend image..."
    - trivy image frontend:latest
    - echo "✅ Image scans completed"
  tags:
    - shared
  allow_failure: true
  only:
    - develop
    - main
 


# 6. Docker Push using Kaniko
docker_push:
  stage: docker-push
  image: gcr.io/kaniko-project/executor:latest
  variables:
    DOCKER_CONFIG: /kaniko/.docker
  before_script:
    - echo "🔐 Setting up Docker Hub authentication..."
    - mkdir -p /kaniko/.docker
    - echo '{"auths":{"https://index.docker.io/v1/":{"auth":"'$(echo -n $DOCKER_USERNAME:$DOCKER_PASSWORD | base64)'"}}}' > /kaniko/.docker/config.json
  script:
    - echo "📤 Pushing backend image..."
    - /kaniko/executor
        --context application/backend
        --dockerfile application/backend/Dockerfile
        --destination $DOCKER_USERNAME/backend:latest
        --destination $DOCKER_USERNAME/backend:${CI_COMMIT_REF_SLUG}
        --cache=true
    - echo "📤 Pushing frontend image..."
    - /kaniko/executor
        --context application/frontend
        --dockerfile application/frontend/Dockerfile
        --destination $DOCKER_USERNAME/frontend:latest
        --destination $DOCKER_USERNAME/frontend:${CI_COMMIT_REF_SLUG}
        --cache=true
    - echo "✅ All images pushed successfully"
  tags:
    - shared
  only:
    - develop
    - main

