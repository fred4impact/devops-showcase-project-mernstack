# MERN Stack DevOps Showcase - CI/CD Pipeline
# Automated build, test, and deployment pipeline for MERN stack application

stages:
  - security
  - build
  - test
  - docker-build
  - image-scan
  - docker-push

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: .npm
  NODE_OPTIONS: "--max-old-space-size=4096"
  DOCKER_TAG: latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/
security_scan:
  stage: security
  image: node:18-alpine
  script:
    - echo "🔍 Running security audits..."
    - cd application/backend && npm ci --cache .npm --prefer-offline
    - cd application/backend && npm audit --audit-level=moderate || true
    - cd application/frontend && npm ci --cache .npm --prefer-offline
    - cd application/frontend && npm audit --audit-level=moderate || true
    - echo "✅ Security scans completed"
  tags:
    - shared
  only:
    - develop
    - main
    - merge_requests
build_applications:
  stage: build
  image: node:18-alpine
  script:
    - echo "🏗️ Building applications..."
    - cd application/backend && npm ci --cache .npm --prefer-offline
    - cd application/backend && npm run build
    - cd application/frontend && npm ci --cache .npm --prefer-offline
    - cd application/frontend && npm run build
    - echo "✅ All applications built successfully"
  tags:
    - shared
  only:
    - develop
    - main
    - merge_requests
run_tests:
  stage: test
  image: node:18-alpine
  script:
    - echo "🧪 Running all tests..."
    - cd application/backend && npm ci --cache .npm --prefer-offline
    - cd application/backend && npm test || echo "⚠️ Backend tests failed (non-blocking)"
    - cd application/frontend && npm ci --cache .npm --prefer-offline
    - cd application/frontend && npm test || echo "⚠️ Frontend tests failed (non-blocking)"
    - cd tests && npm ci --cache .npm --prefer-offline
    - cd tests && npm test || echo "⚠️ Integration tests failed (non-blocking)"
    - echo "✅ All tests completed"
  allow_failure: true
  tags:
    - shared
  only:
    - develop
    - main
    - merge_requests

# Docker Build Stage
docker_build:
  stage: docker-build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Setting up Docker environment..."
    - sleep 30
    - echo "Testing Docker daemon connection..."
    - for i in {1..10}; do
        if docker info >/dev/null 2>&1; then
          echo "✅ Docker daemon is ready!"
          break
        else
          echo "Waiting for Docker daemon... (attempt $i/10)"
          sleep 10
        fi
      done
    - docker info
  script:
    - echo "🐳 Building Docker images..."
    - docker build --no-cache -t backend:$DOCKER_TAG -f application/backend/Dockerfile application/backend/
    - docker build --no-cache -t frontend:$DOCKER_TAG -f application/frontend/Dockerfile application/frontend/
    - echo "✅ All Docker images built successfully"
    - docker images
  tags:
    - shared
  only:
    - develop
    - main
    - merge_requests

# Image Security Scanning Stage
image_scan:
  stage: image-scan
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Setting up Docker environment..."
    - apk add --no-cache curl
    - echo "Waiting for Docker daemon to be ready..."
    - sleep 10
    - until docker info >/dev/null 2>&1; do echo "Waiting for Docker daemon..."; sleep 2; done
    - docker info
  script:
    - echo "🔍 Scanning Docker images for vulnerabilities..."
    - docker run --rm --network host aquasec/trivy:latest image backend:$DOCKER_TAG
    - docker run --rm --network host aquasec/trivy:latest image frontend:$DOCKER_TAG
    - echo "✅ Image scans completed"
  tags:
    - shared
  allow_failure: true
  only:
    - develop
    - main
    - merge_requests

# Docker Push Stage
docker_push:
  stage: docker-push
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Setting up Docker environment..."
    - sleep 15
    - until docker info >/dev/null 2>&1; do echo "Waiting for Docker daemon..."; sleep 3; done
    - docker info
    - echo "🔐 Logging into Docker Hub..."
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - echo "📤 Pushing images to Docker Hub..."
    - docker tag backend:$DOCKER_TAG $DOCKER_USERNAME/backend:$DOCKER_TAG
    - docker tag frontend:$DOCKER_TAG $DOCKER_USERNAME/frontend:$DOCKER_TAG
    - docker push $DOCKER_USERNAME/backend:$DOCKER_TAG
    - docker push $DOCKER_USERNAME/frontend:$DOCKER_TAG
    - echo "✅ All images pushed successfully"
    - docker images
  tags:
    - shared
  only:
    - develop
    - main
    - merge_requests
