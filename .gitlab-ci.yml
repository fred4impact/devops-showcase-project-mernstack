# MERN Stack DevOps Showcase - CI/CD Pipeline
# Automated build, test, and deployment pipeline for MERN stack application

stages:
  - security
  - build
  - test
variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: .npm
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/
security_scan_backend:
  stage: security
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for backend..."
    - npm audit --audit-level=moderate || true
    - echo "✅ Backend security scan completed"
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
security_scan_frontend:
  stage: security
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for frontend..."
    - npm audit --audit-level=moderate || true
    - echo "✅ Frontend security scan completed"
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
backend_build:
  stage: build
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🏗️ Building backend application..."
    - npm run build
    - echo "✅ Backend build completed successfully"
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
frontend_build:
  stage: build
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🏗️ Building frontend application..."
    - npm run build
    - echo "✅ Frontend build completed successfully"
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
backend_test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Running backend tests..."
    - npm test || echo "⚠️ Backend tests failed (non-blocking)"
    - echo "✅ Backend tests completed"
  allow_failure: true
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
frontend_test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Running frontend tests..."
    - npm test || echo "⚠️ Frontend tests failed (non-blocking)"
    - echo "✅ Frontend tests completed"
  allow_failure: true
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
integration_test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd tests
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Running integration tests..."
    - npm test || echo "⚠️ Integration tests failed (non-blocking)"
    - echo "✅ Integration tests completed"
  allow_failure: true
  tags:
    - docker
    - shared
  only:
    - develop
    - main
    - merge_requests
