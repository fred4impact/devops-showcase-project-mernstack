# MERN Stack DevOps Showcase - CI/CD Pipeline
# Automated build, test, and deployment pipeline for MERN stack application

stages:
  - security
  - build
  - test
  - docker-build
  - image-scan
  - docker-push

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: .npm
  NODE_OPTIONS: "--max-old-space-size=4096"
  DOCKER_TAG: latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/

# 1. Security Scan
security_scan:
  stage: security
  image: node:18-alpine
  script:
    - echo "🔍 Running security audits..."
    - cd application/backend
    - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline; else npm install --cache .npm --prefer-offline; fi
    - npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
    - cd ../frontend
    - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline; else npm install --cache .npm --prefer-offline; fi
    - npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
  tags:
    - shared
  allow_failure: false
  only:
    - develop
    - main




# 2. Build Applications
build:
  stage: build
  image: node:18-alpine
  script:
    - echo "🏗️ Building applications..."
    - cd application/backend && npm ci --cache .npm --prefer-offline && npm run build
    - cd ../frontend && npm ci --cache .npm --prefer-offline && npm run build
    - echo "✅ All applications built successfully"
  tags:
    - shared
  only:
    - develop
    - main


# 3. Run Tests
tests:
  stage: test
  image: node:18-alpine
  script:
    - echo "🧪 Running all tests..."
    - cd tests/backend && npm ci --cache .npm --prefer-offline && npm test || echo "⚠️ Backend tests failed (non-blocking)"
    - cd ../frontend && npm ci --cache .npm --prefer-offline && npm test || echo "⚠️ Frontend tests failed (non-blocking)"
    - cd .. && npm ci --cache .npm --prefer-offline && npm test || echo "⚠️ Integration tests failed (non-blocking)"
    - echo "✅ All tests completed"
  allow_failure: true
  tags:
    - shared
  only:
    - develop
    - main


# 4. Docker Build
docker_build:
  stage: docker-build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache docker-cli-buildx
    - echo "🔧 Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do echo "⏳ Waiting for Docker..."; sleep 2; done
    - docker version
  script:
    - echo "🏗️ Building backend image..."
    - docker buildx build --platform linux/amd64 \
        -t backend:${CI_COMMIT_REF_SLUG} \
        -t backend:${CI_COMMIT_SHA} \
        -t backend:latest \
        -f application/backend/Dockerfile \
        --load application/backend
    - echo "🏗️ Building frontend image..."
    - docker buildx build --platform linux/amd64 \
        -t frontend:${CI_COMMIT_REF_SLUG} \
        -t frontend:${CI_COMMIT_SHA} \
        -t frontend:latest \
        -f application/frontend/Dockerfile \
        --load application/frontend
    - echo "✅ Build completed"
  tags:
    - shared
  only:
    - develop
    - main

 


image_scan:
  stage: image-scan
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do echo "⏳ Waiting for Docker..."; sleep 2; done
  script:
    - echo "🔍 Scanning backend image..."
    - docker run --rm aquasec/trivy:latest image backend:$DOCKER_TAG
    - echo "🔍 Scanning frontend image..."
    - docker run --rm aquasec/trivy:latest image frontend:$DOCKER_TAG
    - echo "✅ Image scans completed"
  tags:
    - shared
  allow_failure: true
  only:
    - develop
    - main
 


# 6. Docker Push
docker_push:
  stage: docker-push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do echo "⏳ Waiting for Docker..."; sleep 2; done
    - echo "🔐 Logging into Docker Hub..."
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - echo "📤 Pushing backend image..."
    - docker tag backend:$DOCKER_TAG $DOCKER_USERNAME/backend:$DOCKER_TAG
    - docker push $DOCKER_USERNAME/backend:$DOCKER_TAG
    - echo "📤 Pushing frontend image..."
    - docker tag frontend:$DOCKER_TAG $DOCKER_USERNAME/frontend:$DOCKER_TAG
    - docker push $DOCKER_USERNAME/frontend:$DOCKER_TAG
    - echo "✅ All images pushed successfully"
  tags:
    - shared
  only:
    - develop
    - main

