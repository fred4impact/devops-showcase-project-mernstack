# MERN Stack DevOps Showcase - CI/CD Pipeline
# Automated build, test, and deployment pipeline for MERN stack application

stages:
  - security
  - build
  - test
  - docker-build
  - image-scan
  - docker-push

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: .npm
  NODE_OPTIONS: "--max-old-space-size=4096"
  DOCKER_TAG: latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/
  policy: pull-push

# 1. Security Scan
security_scan:
  stage: security
  image: node:20-alpine
  script:
    - echo "🔍 Running security audits..."
    - echo "🧹 Clearing npm cache..."
    - npm cache clean --force
    - cd application/backend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit)
    - npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
    - cd ../frontend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit)
    - npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
  tags:
    - shared
  allow_failure: false
  only:
    - develop
    - main



# 2. Build Applications
build:
  stage: build
  image: node:18-alpine
  script:
    - echo "🏗️ Building applications..."
    - cd application/backend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm run build
    - cd ../frontend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm run build
    - echo "✅ All applications built successfully"
  tags:
    - shared
  only:
    - develop
    - main


# 3. Run Tests
tests:
  stage: test
  image: node:18-alpine
  script:
    - echo "🧪 Running all tests..."
    - cd tests/backend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm test || echo "⚠️ Backend tests failed (non-blocking)"
    - cd ../frontend && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm test || echo "⚠️ Frontend tests failed (non-blocking)"
    - cd .. && (npm ci --cache .npm --prefer-offline --no-audit || npm install --no-audit) && npm test || echo "⚠️ Integration tests failed (non-blocking)"
    - echo "✅ All tests completed"
  allow_failure: true
  tags:
    - shared
  only:
    - develop
    - main


# 4. Docker Build
docker_build:
  stage: docker-build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
  before_script:
    - echo "🔧 Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do echo "⏳ Waiting for Docker..."; sleep 2; done
    - docker version
    - docker info
  script:
    - echo "🏗️ Building backend image..."
    - cd application/backend
    - docker build \
        -t backend:${CI_COMMIT_REF_SLUG} \
        -t backend:${CI_COMMIT_SHA} \
        -t backend:latest \
        -f Dockerfile .
    - echo "🏗️ Building frontend image..."
    - cd ../frontend
    - docker build \
        -t frontend:${CI_COMMIT_REF_SLUG} \
        -t frontend:${CI_COMMIT_SHA} \
        -t frontend:latest \
        -f Dockerfile .
    - echo "✅ Build completed"
  tags:
    - shared
  only:
    - develop
    - main


image_scan:
  stage: image-scan
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do echo "⏳ Waiting for Docker..."; sleep 2; done
  script:
    - echo "🔍 Scanning backend image..."
    - docker run --rm aquasec/trivy:latest image backend:latest
    - echo "🔍 Scanning frontend image..."
    - docker run --rm aquasec/trivy:latest image frontend:latest
    - echo "✅ Image scans completed"
  tags:
    - shared
  allow_failure: true
  only:
    - develop
    - main
 


# 6. Docker Push
docker_push:
  stage: docker-push
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "🔧 Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do echo "⏳ Waiting for Docker..."; sleep 2; done
    - echo "🔐 Logging into Docker Hub..."
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - echo "📤 Pushing backend image..."
    - docker tag backend:latest $DOCKER_USERNAME/backend:latest
    - docker tag backend:latest $DOCKER_USERNAME/backend:${CI_COMMIT_REF_SLUG}
    - docker push $DOCKER_USERNAME/backend:latest
    - docker push $DOCKER_USERNAME/backend:${CI_COMMIT_REF_SLUG}
    - echo "📤 Pushing frontend image..."
    - docker tag frontend:latest $DOCKER_USERNAME/frontend:latest
    - docker tag frontend:latest $DOCKER_USERNAME/frontend:${CI_COMMIT_REF_SLUG}
    - docker push $DOCKER_USERNAME/frontend:latest
    - docker push $DOCKER_USERNAME/frontend:${CI_COMMIT_REF_SLUG}
    - echo "✅ All images pushed successfully"
  tags:
    - shared
  only:
    - develop
    - main

