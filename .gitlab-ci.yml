# MERN Stack DevOps Showcase - CI/CD Pipeline
# Automated build, test, and deployment pipeline for MERN stack application

stages:
  - security
  - build
  - test
  - docker-build
variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: .npm
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/
security_scan_backend:
  stage: security
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for backend..."
    - npm audit --audit-level=moderate || true
    - echo "✅ Backend security scan completed"
  only:
    - develop
    - main
    - merge_requests
security_scan_frontend:
  stage: security
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for frontend..."
    - npm audit --audit-level=moderate || true
    - echo "✅ Frontend security scan completed"
  only:
    - develop
    - main
    - merge_requests
backend_build:
  stage: build
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🏗️ Building backend application..."
    - npm run build
    - echo "✅ Backend build completed successfully"
  only:
    - develop
    - main
    - merge_requests
frontend_build:
  stage: build
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🏗️ Building frontend application..."
    - npm run build
    - echo "✅ Frontend build completed successfully"
  only:
    - develop
    - main
    - merge_requests
backend_test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Running backend tests..."
    - npm test || echo "⚠️ Backend tests failed (non-blocking)"
    - echo "✅ Backend tests completed"
  allow_failure: true
  only:
    - develop
    - main
    - merge_requests
frontend_test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Running frontend tests..."
    - npm test || echo "⚠️ Frontend tests failed (non-blocking)"
    - echo "✅ Frontend tests completed"
  allow_failure: true
  only:
    - develop
    - main
    - merge_requests
integration_test:
  stage: test
  image: node:18-alpine
  before_script:
    - cd tests
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Running integration tests..."
    - npm test || echo "⚠️ Integration tests failed (non-blocking)"
    - echo "✅ Integration tests completed"
  allow_failure: true
  only:
    - develop
    - main
    - merge_requests
docker_build_backend:
  stage: docker-build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TAG: latest
  before_script:
    - cd application/backend
  script:
    - echo "Building backend Docker image..."
    - echo "Using tag: $DOCKER_TAG"
    - docker build -t $CI_REGISTRY_IMAGE/backend:$DOCKER_TAG .
    - echo "Backend Docker image built successfully with tag: $DOCKER_TAG"
  only:
    - develop
    - main
    - merge_requests
docker_build_frontend:
  stage: docker-build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TAG: latest
  before_script:
    - cd application/frontend
  script:
    - echo "Building frontend Docker image..."
    - echo "Using tag: $DOCKER_TAG"
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$DOCKER_TAG .
    - echo "Frontend Docker image built successfully with tag: $DOCKER_TAG"
  only:
    - develop
    - main
    - merge_requests
