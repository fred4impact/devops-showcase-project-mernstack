# GitLab CI/CD Pipeline Configuration
# This file defines the CI/CD pipeline for the MERN Stack DevOps Showcase Project


# Define stages
stages:
  - security
  - build
  - test
  - docker-build
  - docker-security
  - deploy

# Include template files
include:
  - local: 'templates/security-scan.yml'
  - local: 'templates/build-and-test.yml'
  - local: 'templates/docker-build.yml'
  - local: 'templates/docker-security.yml'

# Global variables
variables:
  NODE_VERSION: "18"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"


  # Cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - dist/

# Default image for jobs
default:
  image: node:18-alpine

# Security scanning stage
security_scan:
  stage: security
  extends: .security_scan_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    # Build and test stage
build_and_test:
  stage: build
  extends: .build_and_test_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    

