# GitLab CI/CD Pipeline Configuration
# This file defines the CI/CD pipeline for the MERN Stack DevOps Showcase Project

# Define stages
stages:
  - security
  - build
  - test
  - docker-build
  - docker-security
  - deploy

# Include template files
include:
  - local: 'gitlab-ci/templates/security-scan.yml'
  - local: 'gitlab-ci/templates/build-and-test.yml'
  - local: 'gitlab-ci/templates/docker-build.yml'
  - local: 'gitlab-ci/templates/docker-security.yml'

# Global variables
variables:
  NODE_VERSION: "18"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - dist/

# Default image for jobs
default:
  image: node:18-alpine

# Security scanning stage
security_scan:
  stage: security
  extends: .security_scan_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build and test stage
build_and_test:
  stage: build
  extends: .build_and_test_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Docker build stages (using templates)
build_backend_image:
  extends: .docker_build_template
  stage: docker-build
  script:
    - echo "Building backend Docker image..."
    - cd application/backend
    - |
      # Build backend image with commit SHA and latest tags
      docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA .
      docker build -t $CI_REGISTRY_IMAGE/backend:latest .
    - |
      # Login to GitLab Container Registry
      echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - |
      # Push images to GitLab Container Registry
      docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
      docker push $CI_REGISTRY_IMAGE/backend:latest

build_frontend_image:
  extends: .docker_build_template
  stage: docker-build
  script:
    - echo "Building frontend Docker image..."
    - cd application/frontend
    - |
      # Build frontend image with commit SHA and latest tags
      docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA .
      docker build -t $CI_REGISTRY_IMAGE/frontend:latest .
    - |
      # Login to GitLab Container Registry
      echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - |
      # Push images to GitLab Container Registry
      docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
      docker push $CI_REGISTRY_IMAGE/frontend:latest

# Docker image security scanning
scan_backend_image:
  extends: .docker_security_scan_template
  stage: docker-security
  script:
    - echo "Scanning backend Docker image for vulnerabilities..."
    - |
      # Pull the built image
      docker pull $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - |
      # Scan with Trivy
      trivy image --format json --output backend-trivy-report.json $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - |
      # Scan with Snyk
      snyk container test $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA --json > backend-snyk-report.json || true
    - |
      # Scan with Docker Scout
      docker scout cves $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA --format json > backend-scout-report.json || true
  artifacts:
    reports:
      container_scanning: backend-trivy-report.json
    paths:
      - backend-trivy-report.json
      - backend-snyk-report.json
      - backend-scout-report.json
    expire_in: 1 week
  needs:
    - build_backend_image

scan_frontend_image:
  extends: .docker_security_scan_template
  stage: docker-security
  script:
    - echo "Scanning frontend Docker image for vulnerabilities..."
    - |
      # Pull the built image
      docker pull $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - |
      # Scan with Trivy
      trivy image --format json --output frontend-trivy-report.json $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - |
      # Scan with Snyk
      snyk container test $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA --json > frontend-snyk-report.json || true
    - |
      # Scan with Docker Scout
      docker scout cves $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA --format json > frontend-scout-report.json || true
  artifacts:
    reports:
      container_scanning: frontend-trivy-report.json
    paths:
      - frontend-trivy-report.json
      - frontend-snyk-report.json
      - frontend-scout-report.json
    expire_in: 1 week
  needs:
    - build_frontend_image

# Deploy to Docker Hub (requires DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN variables)
deploy_to_docker_hub:
  extends: .docker_build_template
  stage: deploy
  variables:
    DOCKER_HUB_NAMESPACE: $DOCKER_HUB_USERNAME
  before_script:
    - echo $DOCKER_HUB_TOKEN | docker login -u $DOCKER_HUB_USERNAME --password-stdin
  script:
    - echo "Deploying to Docker Hub..."
    - |
      # Pull images from GitLab Container Registry
      docker pull $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
      docker pull $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - |
      # Tag and push backend to Docker Hub
      docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA $DOCKER_HUB_NAMESPACE/mern-backend:$CI_COMMIT_SHA
      docker tag $CI_REGISTRY_IMAGE/backend:latest $DOCKER_HUB_NAMESPACE/mern-backend:latest
      docker push $DOCKER_HUB_NAMESPACE/mern-backend:$CI_COMMIT_SHA
      docker push $DOCKER_HUB_NAMESPACE/mern-backend:latest
    - |
      # Tag and push frontend to Docker Hub
      docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA $DOCKER_HUB_NAMESPACE/mern-frontend:$CI_COMMIT_SHA
      docker tag $CI_REGISTRY_IMAGE/frontend:latest $DOCKER_HUB_NAMESPACE/mern-frontend:latest
      docker push $DOCKER_HUB_NAMESPACE/mern-frontend:$CI_COMMIT_SHA
      docker push $DOCKER_HUB_NAMESPACE/mern-frontend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual
  needs:
    - scan_backend_image
    - scan_frontend_image
