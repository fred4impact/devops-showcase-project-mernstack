# GitLab CI/CD Pipeline for MERN Stack DevOps Showcase Project
# Stage-by-stage implementation for testing and validation

# Define pipeline stages
stages:
  - security
  - build
  - test
  - docker-build
  - docker-security
  - deploy

# Global variables
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: ".npm"
  NPM_CONFIG_PRODUCTION: "false"

# Cache configuration for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - application/backend/node_modules/
    - application/frontend/node_modules/
    - tests/node_modules/

# ===========================================
# STAGE 1: SECURITY SCANNING
# ===========================================

# Security scan for backend dependencies
security_scan_backend:
  stage: security
  image: node:18-alpine
  before_script:
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for backend..."
    - npm audit --audit-level=moderate
    - echo "📊 Checking for outdated packages..."
    - npm outdated || true
    - echo "🔒 Running dependency check..."
    - npm ls --depth=0
  artifacts:
    reports:
      junit: application/backend/security-report.xml
    paths:
      - application/backend/security-report.xml
    expire_in: 1 week
  only:
    - develop
    - main
    - merge_requests

# Security scan for frontend dependencies
security_scan_frontend:
  stage: security
  image: node:18-alpine
  before_script:
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for frontend..."
    - npm audit --audit-level=moderate
    - echo "📊 Checking for outdated packages..."
    - npm outdated || true
    - echo "🔒 Running dependency check..."
    - npm ls --depth=0
  artifacts:
    reports:
      junit: application/frontend/security-report.xml
    paths:
      - application/frontend/security-report.xml
    expire_in: 1 week
  only:
    - develop
    - main
    - merge_requests

# Security scan for test dependencies
security_scan_tests:
  stage: security
  image: node:18-alpine
  before_script:
    - cd tests
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Running security audit for test dependencies..."
    - npm audit --audit-level=moderate
    - echo "📊 Checking for outdated packages..."
    - npm outdated || true
    - echo "🔒 Running dependency check..."
    - npm ls --depth=0
  artifacts:
    reports:
      junit: tests/security-report.xml
    paths:
      - tests/security-report.xml
    expire_in: 1 week
  only:
    - develop
    - main
    - merge_requests


