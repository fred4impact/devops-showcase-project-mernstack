# GitLab CI/CD Pipeline Configuration
# This file defines the CI/CD pipeline for the MERN Stack DevOps Showcase Project

# Define stages
stages:
  - security
  - build
  - test
  
# Include template files (commented out for now)
# include:
#   - local: 'gitlab-ci/templates/security-scan.yml'
#   - local: 'gitlab-ci/templates/build-and-test.yml'

# Global variables
variables:
  NODE_VERSION: "18"

# Cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - dist/

# Default image for jobs
default:
  image: node:18-alpine

# Security scanning stage
security_scan:
  stage: security
  image: node:18-alpine
  before_script:
    - apk add --no-cache git
  script:
    - echo "Running security scans..."
    - |
      # Backend security scan
      cd application/backend
      echo "Scanning backend dependencies..."
      npm audit --audit-level=moderate || true
    - |
      # Frontend security scan
      cd application/frontend
      echo "Scanning frontend dependencies..."
      npm audit --audit-level=moderate || true
    - |
      # Test security scan
      cd tests
      echo "Scanning test dependencies..."
      npm audit --audit-level=moderate || true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Backend build and test
backend_build_test:
  stage: build
  image: node:18-alpine
  before_script:
    - apk add --no-cache git
    - npm install -g npm@latest
  script:
    - echo "Building and testing backend..."
    - cd application/backend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run test || true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - application/backend/node_modules/
      - .npm/
  artifacts:
    paths:
      - application/backend/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Frontend build and test
frontend_build_test:
  stage: build
  image: node:18-alpine
  before_script:
    - apk add --no-cache git
    - npm install -g npm@latest
  script:
    - echo "Building and testing frontend..."
    - cd application/frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run test || true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - application/frontend/node_modules/
      - .npm/
  artifacts:
    paths:
      - application/frontend/.next/
      - application/frontend/out/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Integration tests
integration_tests:
  stage: test
  image: node:18-alpine
  services:
    - name: mongo:latest
      alias: mongodb
    - name: redis:alpine
      alias: redis
  variables:
    MONGODB_URI: "mongodb://mongodb:27017/test"
    REDIS_URL: "redis://redis:6379"
  before_script:
    - apk add --no-cache git
    - npm install -g npm@latest
  script:
    - echo "Running integration tests..."
    - cd tests
    - npm ci --cache .npm --prefer-offline
    - npm run test:integration || true
    - npm run test:api || true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - tests/node_modules/
      - .npm/
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH




